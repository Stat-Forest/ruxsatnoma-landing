# docker-compose.deploy.yml
# The public landing: nginx plus the dist/ bundle. Publishes no port — Caddy reaches it by
# name over the shared edge network, both for dev.ruxsatnoma-urmon.uz and for the /check
# path of dev-api.ruxsatnoma-urmon.uz (ruling R5).
services:
  landing:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: ruxsatnoma-landing:latest
    restart: unless-stopped
    networks:
      edge:
        aliases: [landing]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge:
    external: true
    name: ruxsatnoma-edge
