# .github/workflows/checks.yml
name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      upload-dist:
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
      - name: Upload the bundle
        if: ${{ inputs.upload-dist }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
