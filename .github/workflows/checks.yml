# .github/workflows/checks.yml
name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      upload-dist:
        type: boolean
        default: false
      api-base-url:
        # Baked into the bundle at BUILD time — Vite substitutes `import.meta.env`
        # literally, so there is no runtime override and a wrong value here ships a
        # site that calls the wrong host. Empty on a plain PR run (the artifact is
        # thrown away); the deploy workflow passes its environment's real API origin.
        # Without this the fallback in `src/api/client.ts` — `http://localhost:8000`
        # — went out to the dev server, where every public call was blocked by the
        # browser and the tariff calculator simply reported itself unavailable.
        type: string
        default: ''
      admin-base-url:
        # Same property as api-base-url: baked into the bundle at BUILD time, so
        # there is no runtime override. Empty on a plain PR run (the artifact is
        # thrown away); the deploy workflow passes its environment's real adminka
        # origin. An unset value does not fail the build — `src/lib/cabinet.ts`
        # throws only when a sign-in link is actually clicked, loud rather than a
        # silent dead link — but a deploy must never ship with this empty.
        type: string
        default: ''

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
        env:
          VITE_API_BASE_URL: ${{ inputs.api-base-url }}
          VITE_ADMIN_BASE_URL: ${{ inputs.admin-base-url }}
      - run: yarn run test
      - name: Upload the bundle
        if: ${{ inputs.upload-dist }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
