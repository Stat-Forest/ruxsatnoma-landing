<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Coverflow Carousel</title>
  <style>
    :root {
      --bg-color: #0a0a0a;
      --card-width: 250px;
      --card-height: 320px;
      --card-width-active: 280px;
      --card-height-active: 360px;
      --font-family: 'Inter', 'Helvetica Neue', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: var(--font-family);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: white;
    }

    /* Carousel Container */
    .carousel-container {
      position: relative;
      width: 100%;
      max-width: 1200px;
      perspective: 1000px; /* 3D Perspective */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .carousel-track {
      position: relative;
      width: 100%;
      height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
      cursor: grab;
    }

    .carousel-track:active {
      cursor: grabbing;
    }

    /* Card */
    .card {
      position: absolute;
      width: var(--card-width);
      height: var(--card-height);
      border-radius: 16px;
      background-color: #222;
      background-size: cover;
      background-position: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1),
                  opacity 0.6s ease, filter 0.6s ease;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      /* Default state */
      opacity: 0;
      pointer-events: none;
    }

    /* Smooth resizing using scale instead of animating width/height is preferred for performance, 
       but for the active card expansion requested, we will use a small transition on width/height */
    .card {
       transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .card.active {
      pointer-events: auto;
      width: var(--card-width-active);
      height: var(--card-height-active);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }

    /* Gradient Overlay */
    .card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0,0,0,0) 100%);
      pointer-events: none;
    }

    /* Title */
    .card-title {
      position: relative;
      z-index: 10;
      padding: 24px 20px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      transition: font-size 0.6s ease;
    }

    .card.active .card-title {
      font-size: 1.25rem;
    }

    /* Navigation Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-top: 40px;
      z-index: 100;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.3s ease;
      user-select: none;
      outline: none;
    }

    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .nav-btn:active {
      transform: scale(0.9);
    }

    /* Pagination Dots */
    .pagination {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 3px;
      background-color: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.4s ease;
    }

    .dot:hover {
      background-color: rgba(255, 255, 255, 0.6);
    }

    .dot.active {
      width: 24px;
      height: 4px;
      background-color: #ffffff;
    }

    @media (max-width: 768px) {
      :root {
        --card-width: 180px;
        --card-height: 240px;
        --card-width-active: 200px;
        --card-height-active: 280px;
      }
      .card-title {
        font-size: 0.9rem;
        padding: 16px 12px;
      }
      .card.active .card-title {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="carousel-container">
    <div class="carousel-track" id="track">
      <!-- Cards will be injected by JS -->
    </div>

    <div class="controls">
      <button class="nav-btn" id="prevBtn">&lsaquo;</button>
      <div class="pagination" id="pagination">
        <!-- Dots will be injected by JS -->
      </div>
      <button class="nav-btn" id="nextBtn">&rsaquo;</button>
    </div>
  </div>

  <script>
    // Data for the cards (Architecture Theme)
    const data = [
      { title: "Cobalt Facade", img: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=600&auto=format&fit=crop" },
      { title: "Concrete Chorus", img: "https://images.unsplash.com/photo-1481026469463-66327c86e544?q=80&w=600&auto=format&fit=crop" },
      { title: "The Long Curve", img: "https://images.unsplash.com/photo-1479839672679-a46483c0e7c8?q=80&w=600&auto=format&fit=crop" },
      { title: "Quiet Lines", img: "https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=600&auto=format&fit=crop" },
      { title: "Water and Stone", img: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=600&auto=format&fit=crop" },
      { title: "Cut From the Sky", img: "https://images.unsplash.com/photo-1506526620573-04dccefa6dc1?q=80&w=600&auto=format&fit=crop" },
      { title: "Vanishing Point", img: "https://images.unsplash.com/photo-1517048676732-d65bc937f952?q=80&w=600&auto=format&fit=crop" },
      { title: "Chrome and Gravity", img: "https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=600&auto=format&fit=crop" },
      { title: "Glass Horizon", img: "https://images.unsplash.com/photo-1545622384-5f80b2719129?q=80&w=600&auto=format&fit=crop" }
    ];

    const track = document.getElementById('track');
    const pagination = document.getElementById('pagination');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let activeIndex = 0;
    const count = data.length;
    let autoplayInterval;

    // Initialize Carousel
    function initCarousel() {
      data.forEach((item, index) => {
        // Create Card
        const card = document.createElement('div');
        card.className = 'card';
        card.style.backgroundImage = `url(${item.img})`;
        
        const overlay = document.createElement('div');
        overlay.className = 'card-overlay';

        const title = document.createElement('div');
        title.className = 'card-title';
        title.innerText = item.title;

        card.appendChild(overlay);
        card.appendChild(title);
        
        // Card click event
        card.addEventListener('click', () => {
          if (activeIndex !== index) {
            activeIndex = index;
            updateCarousel();
            resetAutoplay();
          }
        });

        track.appendChild(card);

        // Create Pagination Dot
        const dot = document.createElement('div');
        dot.className = 'dot';
        dot.addEventListener('click', () => {
          activeIndex = index;
          updateCarousel();
          resetAutoplay();
        });
        pagination.appendChild(dot);
      });

      updateCarousel();
      startAutoplay();
    }

    // Mathematical logic for Coverflow Transforms
    function updateCarousel() {
      const cards = document.querySelectorAll('.card');
      const dots = document.querySelectorAll('.dot');

      cards.forEach((card, i) => {
        // Calculate the shortest distance in a circular array
        let offset = i - activeIndex;
        if (offset > count / 2) offset -= count;
        if (offset < -count / 2) offset += count;

        const isCenter = offset === 0;
        const absOffset = Math.abs(offset);

        // Transform logic exactly mimicking Coverflow
        const translateZ = isCenter ? 0 : -absOffset * 80;
        const rotateY = isCenter ? 0 : (offset < 0 ? 35 : -35);
        // Center card is 0. Side cards are pushed out to 90% + 20% per step.
        const translateX = isCenter ? 0 : (offset < 0 ? -(90 + absOffset * 20) : (90 + absOffset * 20));
        
        // Slightly scale down side cards
        const scale = isCenter ? 1 : Math.max(0.75, 1 - absOffset * 0.1);
        
        // Dim inactive cards
        const brightness = isCenter ? 1 : Math.max(0.4, 1 - absOffset * 0.2);
        const zIndex = count - absOffset;

        // Apply dynamic styles
        card.style.transform = `translateX(${translateX}%) translateZ(${translateZ}px) rotateY(${rotateY}deg) scale(${scale})`;
        card.style.zIndex = zIndex;
        card.style.filter = `brightness(${brightness})`;
        
        if (isCenter) {
          card.classList.add('active');
          card.style.opacity = 1;
        } else {
          card.classList.remove('active');
          // Fully hide items that are too far in the back
          card.style.opacity = absOffset > 3 ? 0 : 1;
        }
      });

      // Update Pagination Dots
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === activeIndex);
      });
    }

    // Navigation logic
    function goNext() {
      activeIndex = (activeIndex + 1) % count;
      updateCarousel();
    }

    function goPrev() {
      activeIndex = (activeIndex - 1 + count) % count;
      updateCarousel();
    }

    prevBtn.addEventListener('click', () => {
      goPrev();
      resetAutoplay();
    });

    nextBtn.addEventListener('click', () => {
      goNext();
      resetAutoplay();
    });

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        goNext();
        resetAutoplay();
      } else if (e.key === 'ArrowLeft') {
        goPrev();
        resetAutoplay();
      }
    });

    // Mouse / Touch Drag Support
    let isDragging = false;
    let startX = 0;
    let dragDistance = 0;

    function handleDragStart(x) {
      isDragging = true;
      startX = x;
      pauseAutoplay();
      track.style.cursor = 'grabbing';
    }

    function handleDragMove(x) {
      if (!isDragging) return;
      dragDistance = x - startX;
    }

    function handleDragEnd() {
      if (!isDragging) return;
      isDragging = false;
      track.style.cursor = 'grab';
      
      const threshold = 50; // Minimum drag distance (px) to trigger slide change
      if (dragDistance > threshold) {
        goPrev();
      } else if (dragDistance < -threshold) {
        goNext();
      }
      
      dragDistance = 0;
      resetAutoplay();
    }

    // Mouse events
    track.addEventListener('mousedown', (e) => handleDragStart(e.clientX));
    window.addEventListener('mousemove', (e) => handleDragMove(e.clientX));
    window.addEventListener('mouseup', handleDragEnd);

    // Touch events
    track.addEventListener('touchstart', (e) => handleDragStart(e.touches[0].clientX));
    window.addEventListener('touchmove', (e) => handleDragMove(e.touches[0].clientX));
    window.addEventListener('touchend', handleDragEnd);

    // Autoplay logic
    function startAutoplay() {
      autoplayInterval = setInterval(goNext, 3500);
    }

    function pauseAutoplay() {
      clearInterval(autoplayInterval);
    }

    function resetAutoplay() {
      pauseAutoplay();
      startAutoplay();
    }

    // Pause autoplay on hover
    const container = document.querySelector('.carousel-container');
    container.addEventListener('mouseenter', pauseAutoplay);
    container.addEventListener('mouseleave', startAutoplay);

    // Initialize the carousel on page load
    initCarousel();

  </script>
</body>
</html>
